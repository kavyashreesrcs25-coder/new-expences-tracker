<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Savings Ideas</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  
  <style>
    :root { --primary:#009688; --radius:14px; }

    body {
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #84fab0, #8fd3f4);
      color: #333;
      text-align: center;
      padding: 40px;
      animation: fadeIn .8s;
    }

    .idea {
      background: white;
      border-radius: var(--radius);
      padding: 20px;
      margin: 20px auto;
      max-width: 600px;
      box-shadow: 0 6px 20px rgba(0,0,0,.15);
      animation: slideUp .5s;
    }

    .back-btn {
      background: var(--primary);
      color: white;
      padding: 12px 20px;
      border-radius: var(--radius);
      text-decoration: none;
      box-shadow: 0 6px 20px rgba(0,0,0,.15);
      transition: .2s;
    }
    .back-btn:hover { transform:scale(1.05); }

    @keyframes fadeIn { from{opacity:0;} }
    @keyframes slideUp { from{opacity:0; transform:translateY(20px);} }
  </style>
</head>

<body>
  <h1>💡 Smart Saving Ideas</h1>
  <div class="idea">🏦 Save 10% of your income automatically.</div>
  <div class="idea">☕ Cut down on small daily expenses — they add up!</div>
  <div class="idea">💳 Use digital wallets with cashback offers.</div>
  <div class="idea">🛍️ Avoid impulse shopping — use a 24-hour rule.</div>
  <div class="idea">📈 Invest small amounts regularly.</div>

  <a href="index.html" class="back-btn">⬅ Back to Home</a>
</body>
</html>
